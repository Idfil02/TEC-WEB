<h2 class="settings-title">Impostazioni</h2>
<div class="tabella-cambio">
  <h3 class="settings-title">Cambia nome utente</h3>
  <form id="changeUsernameForm" method="POST" action="php/re_set_user.php">
    <label for="new-name">Nuovo nome utente</label>
    <input
      type="text"
      id="new-name"
      name="new-name"
      required
      placeholder="Nuovo Nome"
    />
    <br />
    <input type="submit" value="Cambia" class="submit text-button" />
  </form>
</div>
<br />
<div class="tabella-cambio">
  <h3 class="settings-title">Cambia password</h3>
  <form id="changePasswordForm" method="POST" action="php/set_password.php">
    <label for="old-password">Vecchia password</label>
    <input
      type="password"
      id="old-password"
      name="old-password"
      required
      placeholder="Vecchia Password"
    />
    <label for="new-password">Nuova password</label>
    <input
      type="password"
      id="new-password"
      name="new-password"
      required
      placeholder="Nuova Paswword"
    />
    <br />
    <input type="submit" value="Cambia" class="submit text-button" />
  </form>
</div>
<br />
<form id="deleteAccountForm" method="post" action="php/delete_account.php">
  <h2 id="delete-account-title" class="settings-title">Elimina Account PERMANENTEMENTE</h2>

  <label for="username">Username:</label>
  <input
    type="text"
    id="username"
    name="username"
    required
    placeholder="Nome Utente"
    minlength="3"
    maxlength="20"
  />

  <label for="password">Password:</label>
  <input
    type="password"
    id="password"
    name="password"
    required
    placeholder="Password"
    minlength="6"
  />
  <br />
  <input
    type="submit"
    class="submit text-button"
    value="Elimina account"
    action="php/delete_account.php"
  />
</form>

<script src="script/messages.js"></script>
