<div id="search-wrapper">
    <h2 class="ricerca">Risultati di ricerca per: <span class="search-tag tag">[tag-ricerca]</span></h2>
    
    [risultati-ricerca]

    <div id="more-quiz" class="hidden"> 
        <p><strong>Non hai trovato ciò che cerchi?</strong></p>
        <button id="more-quiz-btn" class="text-button" type="button">Suggeriscici un quiz</button>
    </div>
</div>
<div id="suggestion-modal" class="modal hidden" role="dialog" aria-modal="false" tabindex="-1" >
    <h1 tabindex="-1">Dicci la tua!</h1>
    <form id="suggestions-form" class="" method="POST">
        <label for="suggestion-text">Quale quiz vorresti vedere su QuackWiz?</label>
        <textarea id="suggestion-text" name="suggestion" rows="4" cols="50" minlength="2" required></textarea>
        <div>
            <button id="close-suggestions" class="cancel text-button" type="button">Annulla</button>
            <input id="submit-suggestion" class="submit text-button" type="submit" value="Invia il messaggio"/>
        </div>
    </form>
</div>


<script type="module" src="script/saved_quiz.js"></script>
<script type="module" src="script/more_quiz.js"></script>
<noscript>
    <p id="error-no-js"><strong>Attivare Javascript per poter interagire con la pagina.</strong></p>
</noscript>
