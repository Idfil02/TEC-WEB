<h2>Impostazioni</h2>
<div class="tabella-cambio">
  <h3>Cambia Nome Utente</h3>
  <form id="changeUsernameForm" method="POST" action="change_user.php">
    <label for="new-name">Nuovo Nome Utente</label>
    <input
      type="text"
      id="new-name"
      name="new-name"
      required
      placeholder="Nuovo Nome"
      minlength="3"
      maxlength="20"
    />
    <br />
    <input type="submit" value="Cambia" class="submit" />
  </form>
</div>
<br />
<div class="tabella-cambio">
  <h3>Cambia Password</h3>
  <form id="changePasswordForm" method="POST" action="change_password.php">
    <label for="old-password">Vecchia Password</label>
    <input
      type="password"
      id="old-password"
      name="old-password"
      required
      placeholder="Vecchia Password"
    />
    <label for="new-password">Nuova Password</label>
    <input
      type="password"
      id="new-password"
      name="new-password"
      required
      placeholder="Nuova Paswword"
      minlength="6"
    />
    <br />
    <input type="submit" value="Cambia" class="submit" />
  </form>
</div>
<br />

<form id="deleteAccountForm" method="psot" action="delete_account.php">
  <h2>Elimina Account PERMANENTEMENTE</h2>

  <label for="username">Username:</label>
  <input
    type="text"
    id="username"
    name="username"
    required
    placeholder="Nome Utente"
    minlength="3"
    maxlength="20"
  />

  <label for="password">Password:</label>
  <input
    type="password"
    id="password"
    name="password"
    required
    placeholder="Password"
    minlength="6"
  />
  <br />
  <input
    type="submit"
    class="submit"
    value="Elimina account"
    action="delete_account.php"
  />
</form>
